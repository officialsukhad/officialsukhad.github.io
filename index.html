<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0a0908;
    --red: #e2312a;
    --red-dim: rgba(226,49,42,0.28);
    --paper: #f2ede4;
    --grey: #8a8580;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background: var(--black);
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .hazard-bar{
    height: 14px;
    width:100%;
    background: repeating-linear-gradient(
      -45deg,
      var(--red) 0 18px,
      var(--black) 18px 36px
    );
    position:relative;
    z-index:3;
  }

  .grid-bg{
    position:fixed;
    inset:0;
    background-image: radial-gradient(circle at 20% 20%, rgba(226,49,42,0.10), transparent 45%),
                       radial-gradient(circle at 80% 75%, rgba(226,49,42,0.08), transparent 40%);
    pointer-events:none;
    z-index:0;
  }

  .grid-bg::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(226,49,42,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,49,42,0.05) 1px, transparent 1px);
    background-size: 46px 46px;
  }

  header{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 24px 5vw;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    color: var(--grey);
    text-transform:uppercase;
    border-bottom: 1px solid rgba(226,49,42,0.25);
  }

  header .mark{
    color: var(--red);
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:500;
  }

  header .mark::before{
    content:"";
    width:8px;
    height:8px;
    background: var(--red);
    border-radius:50%;
    box-shadow: 0 0 0 3px rgba(226,49,42,0.2);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 3px rgba(226,49,42,0.2); }
    50%{ box-shadow: 0 0 0 7px rgba(226,49,42,0.06); }
  }

  main{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 48px 6vw 56px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color: var(--red);
    margin-bottom:26px;
    display:flex;
    align-items:center;
    gap:12px;
  }

  .eyebrow::before, .eyebrow::after{
    content:"";
    width:28px;
    height:1px;
    background: var(--red-dim);
  }

  .icon-figure{
    width: min(220px, 55vw);
    height:auto;
    margin-bottom: 34px;
  }

  .draw-line{
    fill:none;
    stroke: var(--red);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw 2.2s ease-out forwards;
  }
  .draw-line.d2{ animation-delay: 0.25s; }
  .draw-line.fill{
    fill: var(--red);
    stroke:none;
    opacity:0;
    animation: appear 0.4s ease-out forwards;
    animation-delay: 1.8s;
  }
  @keyframes draw{ to{ stroke-dashoffset: 0; } }
  @keyframes appear{ to{ opacity:1; } }

  h1{
    font-family:'Archivo Black', sans-serif;
    font-weight:400;
    font-size: clamp(2.1rem, 6.4vw, 4.2rem);
    line-height:1.05;
    letter-spacing:-0.01em;
    color: var(--paper);
    max-width: 17ch;
    text-transform:uppercase;
  }

  h1 span{
    color: var(--red);
  }

  p.sub{
    margin-top: 20px;
    max-width: 44ch;
    color: var(--grey);
    font-size: 1.05rem;
    line-height:1.6;
  }

  .progress-wrap{
    margin-top: 46px;
    width: min(420px, 84vw);
  }

  .progress-label{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--grey);
    margin-bottom:8px;
  }

  .progress-label b{ color: var(--red); font-weight:500; }

  .progress-track{
    width:100%;
    height:8px;
    background: rgba(226,49,42,0.08);
    border: 1px solid rgba(226,49,42,0.3);
    position:relative;
    overflow:hidden;
  }

  .progress-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width: 62%;
    background: repeating-linear-gradient(
      -45deg,
      var(--red) 0 12px,
      #b81f19 12px 24px
    );
    background-size: 34px 100%;
    animation: stripes 1.1s linear infinite;
  }

  @keyframes stripes{
    to{ background-position: 34px 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .draw-line, .draw-line.fill, header .mark::before, .progress-fill{
      animation: none !important;
      stroke-dashoffset: 0 !important;
      opacity:1 !important;
    }
  }

  footer{
    position:relative;
    z-index:2;
    border-top: 1px solid rgba(226,49,42,0.25);
    padding: 18px 5vw;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--grey);
  }

  @media (max-width: 520px){
    header{ font-size:10px; padding:18px 5vw; }
    footer{ font-size:10px; }
  }
</style>
</head>
<body>

<div class="hazard-bar" aria-hidden="true"></div>
<div class="grid-bg" aria-hidden="true"></div>

<header>
  <div class="mark">Status: building</div>
  <div>Rev. 08 &middot; 2026</div>
</header>

<main>
  <div class="eyebrow">Under Construction</div>

  <svg class="icon-figure" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Warning triangle icon">
    <path d="M100,20 L180,175 L20,175 Z" class="draw-line" />
    <line x1="100" y1="80" x2="100" y2="130" class="draw-line d2" />
    <circle cx="100" cy="152" r="5" class="draw-line fill" />
  </svg>

  <h1>Something's being <span>built</span> here.</h1>
  <p class="sub">This page isn't ready yet — the crew is still pouring the foundation. Check back soon.</p>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Progress</span>
      <b>62%</b>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>
</main>

<footer>
  <span>&copy; 2026 &middot; All rights reserved</span>
  <span>Site is temporarily offline for maintenance</span>
</footer>

<div class="hazard-bar" aria-hidden="true"></div>

</body>
</html>
